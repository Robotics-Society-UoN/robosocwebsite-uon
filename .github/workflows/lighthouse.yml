name: Lighthouse performance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mobile Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
      - name: Desktop Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json
